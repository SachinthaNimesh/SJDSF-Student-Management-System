name: Deploy Frontend to Azure Static Web Apps

# Trigger: only when files inside web-app/ change on the main branch
on:
  push:
    branches:
      - main
    paths:
      - 'web-app/**'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  build-and-deploy:
    name: Build React App & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the full repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (matches the version used for Vite)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      # 3. Install all npm dependencies
      - name: Install dependencies
        working-directory: ./web-app
        run: npm ci

      # 4. Create the .env.production file from GitHub Secrets
      #    These secrets are set in your GitHub repository settings
      #    They are injected here so Vite can bake them into the build
      - name: Create production environment file
        working-directory: ./web-app
        run: |
          cat > .env.production << EOF
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_ENABLE_LOCAL_AUTH=false
          VITE_AZURE_CLIENT_ID=${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID=${{ secrets.VITE_AZURE_TENANT_ID }}
          VITE_GOOGLE_SHEET_API_KEY=${{ secrets.VITE_GOOGLE_SHEET_API_KEY }}
          EOF

      # 5. Build the Vite/React application for production
      #    Output goes to web-app/dist/
      - name: Build frontend
        working-directory: ./web-app
        run: npm run build

      # 6. Deploy the built dist/ folder to Azure Static Web Apps
      #    AZURE_STATIC_WEB_APPS_API_TOKEN is the deployment token from your Static Web App
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}       # Used for GitHub integrations (auto-provided)
          action: 'upload'
          app_location: '/web-app/dist'                 # Path to the built output folder
          skip_app_build: true                          # We already built above; skip Azure's build step
          output_location: ''                           # Leave empty since we pre-built
